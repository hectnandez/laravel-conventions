# Job reutilizable de verificación de convenciones.
#
# En cada proyecto:
#
#   include:
#       - remote: 'https://raw.githubusercontent.com/hectnandez/laravel-conventions/v1.0.0/ci/conventions.yml'
#
#   conventions:
#       extends: .conventions:check
#       rules:
#           - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
#
# Requiere que el proyecto tenga `composer install` ejecutado y la imagen de CI
# con PHP 8.4+.

.conventions:check:
    stage: quality
    image: ${CI_REGISTRY_IMAGE}:app-latest
    before_script: []
    script:
        - ./vendor/bin/conventions check --json
    rules:
        - if: '$CI_PIPELINE_SOURCE == "web"'
          when: never
        - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "stage"'
        - if: '$CI_COMMIT_BRANCH == "stage"'
        - if: '$CI_COMMIT_TAG'
        - when: never
