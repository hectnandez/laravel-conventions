# Plantilla de despliegue nativo a stage (nginx + PHP-FPM, sin Docker).
#
# Requisitos en el proyecto:
#   - Variables CI: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, SSH_PRIVATE_KEY.
#   - El servidor tiene la release anterior y el .env en shared/.env.
#   - Las migraciones son compatibles hacia atrás (rollback no las revierte).
#
# Uso:
#   include:
#       - remote: 'https://raw.githubusercontent.com/hectnandez/laravel-conventions/v1.0.0/deploy/gitlab/stage.yml'
#
#   deploy:stage:
#       extends: .deploy:stage

.deploy:stage:
    stage: deploy
    image: alpine:3.20
    before_script:
        - apk add --no-cache openssh-client rsync
        - eval "$(ssh-agent -s)"
        - echo "$SSH_PRIVATE_KEY" | ssh-add -
        - mkdir -p ~/.ssh
        - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    script:
        - |
            RELEASE="$(date +%Y%m%d%H%M%S)"
            TARGET="$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$RELEASE"
            rsync -az --delete --exclude='.git' --exclude='.env' --exclude='storage' ./ "$TARGET/"
            ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH/releases/$RELEASE \
                && composer install --no-dev --optimize-autoloader \
                && php artisan migrate --force \
                && php artisan optimize \
                && ln -sfn $DEPLOY_PATH/releases/$RELEASE $DEPLOY_PATH/current \
                && php artisan queue:restart"
    environment:
        name: stage
    rules:
        - if: '$CI_COMMIT_BRANCH == "stage"'
